# Copy this file to BackEnd-EnglishNova/distributed/application-local.properties
# and fill in your local secrets. This file is ignored by git.

# Required for auth-service and gateway-service.
JWT_SECRET=replace-with-a-secret-at-least-32-characters

# Required for services using MySQL.
MYSQL_USERNAME=english_nova
MYSQL_PASSWORD=english_nova

# Required if Nacos auth is enabled.
NACOS_USERNAME=nacos
NACOS_PASSWORD=nacos

# Required for search-service and import-service.
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest

# Optional AI configuration for search-service.
DEEPSEEK_BASE_URL=https://api.deepseek.com
DEEPSEEK_API_KEY=sk-your-deepseek-api-key
DEEPSEEK_MODEL=deepseek-v4-pro

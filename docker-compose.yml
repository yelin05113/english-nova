name: english-nova

x-backend-build: &backend-build
  context: ./BackEnd-EnglishNova/distributed
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: 9200
  NACOS_SERVER_ADDR: nacos:8848
  ENGLISH_NOVA_ENRICHMENT_EXAMPLE_AUDIO_DIR: /app/upload/example-audio

x-backend-env: &backend-env
  env_file:
    - ./.env
  environment:
    <<: *backend-environment
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    nacos:
      condition: service_started
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    elasticsearch:
      condition: service_started

services:
  frontend:
    build:
      context: ./FrontEnd-EnglishNova
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway-service:
        condition: service_started
    restart: unless-stopped

  gateway-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: gateway-service
    environment:
      <<: *backend-environment
      GATEWAY_SERVICE_PORT: ${GATEWAY_CONTAINER_PORT:-8080}
    ports:
      - "${GATEWAY_HOST_PORT:-8087}:${GATEWAY_CONTAINER_PORT:-8080}"
    depends_on:
      nacos:
        condition: service_started

  auth-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: auth-service
    environment:
      <<: *backend-environment
      AUTH_SERVICE_PORT: 8085
    ports:
      - "${AUTH_SERVICE_PORT:-8085}:8085"
    volumes:
      - ./upload:/app/upload

  system-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: system-service
    environment:
      <<: *backend-environment
      SYSTEM_SERVICE_PORT: 8081
    ports:
      - "${SYSTEM_SERVICE_PORT:-8081}:8081"

  study-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: study-service
    environment:
      <<: *backend-environment
      STUDY_SERVICE_PORT: 8082
    ports:
      - "${STUDY_SERVICE_PORT:-8082}:8082"

  search-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: search-service
    environment:
      <<: *backend-environment
      SEARCH_SERVICE_PORT: 8083
    ports:
      - "${SEARCH_SERVICE_PORT:-8083}:8083"
    volumes:
      - ./upload:/app/upload

  import-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: import-service
    environment:
      <<: *backend-environment
      IMPORT_SERVICE_PORT: 8084
    ports:
      - "${IMPORT_SERVICE_PORT:-8084}:8084"

  quiz-service:
    <<: *backend-env
    build:
      <<: *backend-build
      args:
        SERVICE_NAME: quiz-service
    environment:
      <<: *backend-environment
      QUIZ_SERVICE_PORT: 8086
    ports:
      - "${QUIZ_SERVICE_PORT:-8086}:8086"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-english_nova}
      MYSQL_USER: ${MYSQL_USERNAME:-english_nova}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-english_nova}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-4407}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"${MYSQL_USERNAME:-english_nova}" -p"${MYSQL_PASSWORD:-english_nova}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_ADMIN_ENABLE: ${NACOS_AUTH_ADMIN_ENABLE:-true}
      NACOS_AUTH_CONSOLE_ENABLE: ${NACOS_AUTH_CONSOLE_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    restart: unless-stopped

  seeder:
    image: mysql:8.4
    profiles:
      - init
    env_file:
      - ./.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      NACOS_BASE_URL: http://nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      FORCE_SEED_MYSQL: ${FORCE_SEED_MYSQL:-false}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    volumes:
      - ./docker/seeder:/seed/seeder:ro
      - ./docker/mysql:/seed/mysql:ro
      - ./docker/nacos:/seed/nacos:ro
    entrypoint:
      - sh
      - /seed/seeder/seed.sh
    restart: "no"

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        fi;
        exec redis-server --appendonly yes;
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:

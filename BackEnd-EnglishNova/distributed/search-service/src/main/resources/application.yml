spring:
  application:
    name: search-service
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:classpath:application-local.yaml
      - optional:classpath:application-local.properties
      - optional:nacos:${spring.application.name}.yaml
      - optional:file:./application-local.yml
      - optional:file:./application-local.yaml
      - optional:file:./application-local.properties
      - optional:file:./distributed/application-local.yml
      - optional:file:./distributed/application-local.yaml
      - optional:file:./distributed/application-local.properties
      - optional:file:./BackEnd-EnglishNova/distributed/application-local.yml
      - optional:file:./BackEnd-EnglishNova/distributed/application-local.yaml
      - optional:file:./BackEnd-EnglishNova/distributed/application-local.properties
      - optional:file:../application-local.yml
      - optional:file:../application-local.yaml
      - optional:file:../application-local.properties
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:4407}/${MYSQL_DATABASE:english_nova}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

server:
  port: ${SEARCH_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

english-nova:
  gateway:
    internal-auth-secret: ${INTERNAL_AUTH_SECRET:english-nova-internal-auth-secret-change-me}
    internal-auth-max-skew-seconds: ${INTERNAL_AUTH_MAX_SKEW_SECONDS:60}
  search:
    exchange: ${ENGLISH_NOVA_IMPORT_EXCHANGE:english-nova.import}
    index-queue: ${ENGLISH_NOVA_SEARCH_INDEX_QUEUE:english-nova.search.index.queue}
    routing-key: ${ENGLISH_NOVA_INDEXED_ROUTING_KEY:english.nova.wordbook.imported}
    public-catalog:
      external-dir: ${ENGLISH_NOVA_SEARCH_PUBLIC_CATALOG_EXTERNAL_DIR:.local/public-catalog}
  enrichment:
    openai:
      base-url: ${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.openai.com/v1}}
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
      model: ${OPENAI_MODEL:${DEEPSEEK_MODEL:}}
      tts-model: ${ENGLISH_NOVA_ENRICHMENT_TTS_MODEL:gpt-4o-mini-tts}
      tts-voice: ${ENGLISH_NOVA_ENRICHMENT_TTS_VOICE:cedar}
    batch-size: ${ENGLISH_NOVA_ENRICHMENT_BATCH_SIZE:30}
    worker-concurrency: ${ENGLISH_NOVA_ENRICHMENT_WORKER_CONCURRENCY:12}
    tts-concurrency: ${ENGLISH_NOVA_ENRICHMENT_TTS_CONCURRENCY:6}
    max-retries: ${ENGLISH_NOVA_ENRICHMENT_MAX_RETRIES:3}
    worker-delay-ms: ${ENGLISH_NOVA_ENRICHMENT_WORKER_DELAY_MS:1000}
    backfill-delay-ms: ${ENGLISH_NOVA_ENRICHMENT_BACKFILL_DELAY_MS:10000}
    public-limit: ${ENGLISH_NOVA_ENRICHMENT_PUBLIC_LIMIT:35000}
    chat-max-turns: ${ENGLISH_NOVA_ENRICHMENT_CHAT_MAX_TURNS:5}
    chat-timeout-seconds: ${ENGLISH_NOVA_ENRICHMENT_CHAT_TIMEOUT_SECONDS:60}
    chat-max-output-chars: ${ENGLISH_NOVA_ENRICHMENT_CHAT_MAX_OUTPUT_CHARS:1800}
    example-audio-enabled: ${ENGLISH_NOVA_ENRICHMENT_EXAMPLE_AUDIO_ENABLED:false}
    example-audio-dir: ${ENGLISH_NOVA_ENRICHMENT_EXAMPLE_AUDIO_DIR:upload/example-audio}
    text-only-mode: ${ENGLISH_NOVA_ENRICHMENT_TEXT_ONLY_MODE:false}
    audio-only-mode: ${ENGLISH_NOVA_ENRICHMENT_AUDIO_ONLY_MODE:false}
    audio-scope-field: ${ENGLISH_NOVA_ENRICHMENT_AUDIO_SCOPE_FIELD:created_at}
    audio-scope-order: ${ENGLISH_NOVA_ENRICHMENT_AUDIO_SCOPE_ORDER:asc}
    audio-scope-limit: ${ENGLISH_NOVA_ENRICHMENT_AUDIO_SCOPE_LIMIT:50000}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
